{% extends "base.html" %}
{% block content %}
<h1>Добавить приёмного родителя для {{ person.full_name }}</h1>
<p>Выберите биологического родителя, к которому добавляется супруг(а):</p>
<form method="POST">
    <div class="mb-3">
        <select name="parent_id" class="form-select" required>
            <option value="">-- выберите --</option>
            {% for p in available_parents %}
                <option value="{{ p.id }}">{{ p.full_name }} ({{ 'отец' if p.gender == 'M' else 'мать' }})</option>
            {% endfor %}
        </select>
    </div>
    <hr>
    <h4>Данные нового супруга</h4>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label>Фамилия *</label>
            <input type="text" name="surname" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
            <label>Имя *</label>
            <input type="text" name="name" class="form-control" required>
        </div>
    </div>
    <div class="mb-3">
        <label>Отчество</label>
        <input type="text" name="patronymic" class="form-control">
    </div>
    <div class="row">
    <div class="col-md-12 mb-3">
        <label>Дата рождения</label>
        <div class="row g-1">
            <div class="col-3">
                <select name="birth_day" class="form-select">
                    <option value="">День</option>
                    {% for d in range(1,32) %}
                        <option value="{{ d }}" {% if edit and person.birth_day == d %}selected{% endif %}>{{ d }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-3">
                <select name="birth_month" class="form-select">
                    <option value="">Месяц</option>
                    {% for m in range(1,13) %}
                        <option value="{{ m }}" {% if edit and person.birth_month == m %}selected{% endif %}>{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-3">
                <input type="number" name="birth_year" class="form-control" placeholder="Год" value="{{ person.birth_year if edit else '' }}">
            </div>
            <div class="col-3">
                <input type="text" name="birth_notes" class="form-control" placeholder="Описание" value="{{ person.birth_notes if edit else '' }}">
            </div>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-md-12 mb-3">
        <label>Дата смерти</label>
        <div class="row g-1">
            <div class="col-3">
                <select name="death_day" class="form-select">
                    <option value="">День</option>
                    {% for d in range(1,32) %}
                        <option value="{{ d }}" {% if edit and person.death_day == d %}selected{% endif %}>{{ d }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-3">
                <select name="death_month" class="form-select">
                    <option value="">Месяц</option>
                    {% for m in range(1,13) %}
                        <option value="{{ m }}" {% if edit and person.death_month == m %}selected{% endif %}>{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-3">
                <input type="number" name="death_year" class="form-control" placeholder="Год" value="{{ person.death_year if edit else '' }}">
            </div>
            <div class="col-3">
                <input type="text" name="death_notes" class="form-control" placeholder="Описание" value="{{ person.death_notes if edit else '' }}">
            </div>
        </div>
    </div>
</div>
    <div class="mb-3">
        <label>Город</label>
        <input type="text" name="city" class="form-control">
    </div>
    <div class="mb-3">
        <label>Дата брака</label>
        <input type="date" name="marriage_date" class="form-control">
    </div>
    <button class="btn btn-primary">Добавить</button>
    <a href="{{ url_for('person.person_detail', person_id=person.id) }}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
