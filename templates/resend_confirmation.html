{% extends "base.html" %}
{% block content %}
<h1>Повторная отправка подтверждения</h1>
<form method="POST">
    <div class="mb-3">
        <label>Введите ваш email, указанный при регистрации</label>
        <input type="email" name="email" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Отправить</button>
    <a href="{{ url_for('auth.login') }}" class="btn btn-secondary">Назад ко входу</a>
</form>
{% endblock %}
